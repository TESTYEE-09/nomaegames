<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Play NomaeFPS in the browser." />
    <title>NomaeFPS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="arena">
      <header class="hud">
        <a href="../../" class="back">Nomae Games</a>
        <div class="stat"><span>Score</span><strong id="score">0</strong></div>
        <div class="stat"><span>Health</span><strong id="health">100</strong></div>
        <div class="stat"><span>Ammo</span><strong id="ammo">18</strong></div>
      </header>

      <canvas id="game" width="960" height="540" aria-label="NomaeFPS game"></canvas>

      <section class="menu" id="menu">
        <p>NOMAEFPS</p>
        <h1>Browser Arena</h1>
        <button id="start" type="button">Play</button>
      </section>

      <div class="crosshair" aria-hidden="true"></div>
      <p class="help">WASD move / Mouse aim / Click shoot / R reload</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
